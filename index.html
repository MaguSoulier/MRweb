<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Resma</title>
  <meta name="description" content="Media Resma Cooperativa de Diseño">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #000;
      color: #fff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    /* Invierte el logo (video comprimido a partir de logo.gif) (papel gris y tinta negra) y sube el contraste:
       fondo negro y letras blancas. */
    .logo {
      width: min(80vmin, 600px);
      height: auto;
      filter: invert(1) brightness(0.7) contrast(6);
    }
  </style>
</head>
<body>
  <video class="logo" autoplay loop muted playsinline aria-label="Media Resma">
    <source src="logo.mp4" type="video/mp4">
  </video>
  <p>Web en proceso</p>
</body>
</html>
