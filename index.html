<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Resma Cooperativa de Diseño</title>
  <meta name="description" content="Diseño de Comunicación Visual">
  <link rel="icon" href="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="header">
    <a href="#inicio" class="header__logo">
      Cooperativa <em>de</em> diseño<br>
      <em>de</em> comunicación visual
    </a>

    <nav class="header__nav">
      <a href="#proyectos">Proyectos</a>
      <a href="#proyectos">Servicios</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main>

    <!-- HERO: imagen de los papeles -->
    <section class="hero" id="inicio">
      <img class="hero__imagen" src="img/papeles.png" alt="Papeles apilados">
    </section>

    <!-- GIF (o link a la presentación) -->
    <section class="bloque bloque--gif" id="proyectos">
      <a href="https://link-a-la-presentacion" target="_blank" rel="noopener">
        <img src="img/presentacion.gif" alt="Presentación de proyectos">
      </a>
    </section>

    <!-- TEXTO (del brochure, tipo biográfico) -->
    <section class="bloque bloque--texto" id="presentacion">
      <p>Texto del brochure.</p>
    </section>

    <!-- CONTACTO -->
    <section class="bloque bloque--contacto" id="contacto">
      <h2>Contacto</h2>
      <p><a href="mailto:hola@tudominio.com">hola@tudominio.com</a></p>
      <p><a href="https://instagram.com/usuario" target="_blank" rel="noopener">Instagram</a></p>
    </section>

  </main>

  <!-- PIE -->
  <footer class="footer">
    <!-- opcional -->
  </footer>

</body>
</html>
